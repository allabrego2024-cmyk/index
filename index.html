    &lt;script&gt;
        (function () {
            var contenedor = document.querySelector('.contenedor-imagen');
            var cilindro = document.getElementById('cilindro');
            var caras = cilindro.querySelectorAll('.cilindro-cara');
            var total = caras.length;
            var angulo = 360 / total;
            var radio = 0;
            var paso = 0;

            function posicionar() {
                var ancho = contenedor.clientWidth;
                if (!ancho) return;
                radio = Math.round((ancho / 2) / Math.tan(Math.PI / total));
                caras.forEach(function (cara, i) {
                    cara.style.transform = 'rotateY(' + (angulo * i) + 'deg) translateZ(' + radio + 'px)';
                });
                girar();
            }

            function girar() {
                cilindro.style.transform = 'translateZ(' + (-radio) + 'px) rotateY(' + (-angulo * paso) + 'deg)';
                var frontal = ((paso % total) + total) % total;
                caras.forEach(function (cara, i) {
                    cara.classList.toggle('activa', i === frontal);
                });
            }

            var prueba = new Image();
            prueba.onload = function () {
                contenedor.style.aspectRatio = prueba.naturalWidth + ' / ' + prueba.naturalHeight;
                posicionar();
            };
            prueba.src = 'Imagen1.jpg';

            posicionar();
            window.addEventListener('resize', posicionar);

            setInterval(function () {
                paso++;
                girar();
            }, 3000);
        })();
    &lt;/script&gt;

    &lt;script&gt;
        (function () {
            var visor = document.getElementById('visor');
            if (!visor) return;
            var visorImagen = document.getElementById('visorImagen');
            var visorPie = document.getElementById('visorPie');

            document.querySelectorAll('.contenedor-completo img').forEach(function (img) {
                img.addEventListener('click', function () {
                    visorImagen.src = img.src;
                    visorPie.textContent = (img.alt &amp;&amp; img.alt !== 'Imagen') ? img.alt : '';
                    visor.classList.add('abierto');
                });
            });

            function cerrarVisor() {
                visor.classList.remove('abierto');
            }

            document.getElementById('visorCerrar').addEventListener('click', cerrarVisor);
            visor.addEventListener('click', function (e) {
                if (e.target === visor) cerrarVisor();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') cerrarVisor();
            });
        })();

    &lt;script&gt;
        (function () {
            var cifras = document.querySelectorAll('.cifra');
            var duracion = 1800;

            function formatear(v, dec) {
                return v.toLocaleString('en-US', {
                    minimumFractionDigits: dec,
                    maximumFractionDigits: dec
                });
            }

            cifras.forEach(function (el) {
                var dec = parseInt(el.dataset.decimales, 10);
                el.textContent = formatear(0, dec);
            });

            function animar(el, retraso) {
                var objetivo = parseFloat(el.dataset.objetivo);
                var dec = parseInt(el.dataset.decimales, 10);
                var original = el.dataset.original;
                setTimeout(function () {
                    var inicio = null;
                    function paso(ts) {
                        if (inicio === null) inicio = ts;
                        var t = Math.min((ts - inicio) / duracion, 1);
                        var suave = 1 - Math.pow(1 - t, 3);
                        if (t &lt; 1) {
                            el.textContent = formatear(objetivo * suave, dec);
                            requestAnimationFrame(paso);
                        } else {
                            el.textContent = original;
                        }
                    }
                    requestAnimationFrame(paso);
                }, retraso);
            }

            cifras.forEach(function (el, i) {
                animar(el, i * 300);
            });
        })();
    &lt;/script&gt;

    <div class="contador" id="contador"></div>

    <script>
        (function () {
            var slides = Array.prototype.slice.call(document.querySelectorAll('.diapositiva'));
            var contador = document.getElementById('contador');
            var actual = 0;

            function crear(i) {
                var viejo = slides[i];
                var fr = document.createElement('iframe');
                fr.className = 'diapositiva';
                fr.title = viejo.title;
                fr.setAttribute('data-srcdoc', viejo.dataset.srcdoc);
                fr.addEventListener('load', function () {
                    try {
                        fr.contentDocument.addEventListener('keydown', tecla);
                    } catch (e) { }
                });
                fr.srcdoc = viejo.dataset.srcdoc;
                viejo.parentNode.replaceChild(fr, viejo);
                slides[i] = fr;
            }

            function precargar(i) {
                if (i < 0 || i >= slides.length) return;
                var fr = slides[i];
                if (!fr.dataset.cargada) {
                    fr.dataset.cargada = '1';
                    fr.srcdoc = fr.dataset.srcdoc;
                }
            }

            function mostrar(i) {
                if (i < 0) i = 0;
                if (i > slides.length - 1) i = slides.length - 1;
                actual = i;
                crear(i);
                slides.forEach(function (d, k) {
                    d.classList.toggle('activa', k === i);
                });
                precargar(i + 1);
                precargar(i - 1);
                contador.textContent = (i + 1) + ' / ' + slides.length;
            }

            function tecla(e) {
                var k = e.key;
                if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') {
                    e.preventDefault();
                    mostrar(actual + 1);
                } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') {
                    e.preventDefault();
                    mostrar(actual - 1);
                } else if (k === 'Home') {
                    e.preventDefault();
                    mostrar(0);
                } else if (k === 'End') {
                    e.preventDefault();
                    mostrar(slides.length - 1);
                }
            }

            window.addEventListener('keydown', tecla);
            mostrar(0);
        })();
    </script>
